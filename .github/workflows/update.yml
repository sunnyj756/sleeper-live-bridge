name: Update Sleeper League Snapshot

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Sleeper Data
        run: python sleeper_update.py
        env:
          SLEEPER_LEAGUE_ID: '1389390949741793280'
          SLEEPER_USERNAME: samswallows

      - name: Commit latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/players_cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Sleeper snapshot'
            git push
          fi
